<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página con 98.js.org</title>
    <style>
        body {
            margin: 0; /* Elimina márgenes predeterminados */
            overflow: hidden; /* Evita barras de scroll en la página principal */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Asegura que el body ocupe toda la altura de la ventana */
            background-color: #f0f0f0; /* Un color de fondo opcional para tu página */
        }
        iframe {
            width: 100%;
            height: 100vh; /* Ocupa toda la altura de la ventana */
            border: none; /* Elimina el borde predeterminado del iframe */
            display: block; /* Asegura que el iframe se comporte como un bloque */
        }
    </style>
</head>
<body>

    <iframe src="https://98.js.org/"></iframe>

</body>
</html>
